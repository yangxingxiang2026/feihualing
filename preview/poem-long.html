<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>诗笺 · 长诗滚动验证</title>
<style> html,body{margin:0;background:#1E1A16} canvas{display:block;width:375px;height:667px} </style>
</head>
<body>
<script src="./bundle.js"></script>
<script>
  // 极端用例：《长恨歌》960 字 + 120 句，验证滚动与高亮不崩
  (function () {
    if (!window.__fhl) return;
    window.__fhl.app.settings.reduceMotion = true;
    window.__fhl.goto('gloss', {
      outcome: {
        result: 'win', reason: 'roundsFull',
        stats: { hits: 6, tigerHits: 3, rounds: 12, keyword: '天', revenge: { kills: 0, newGrudge: [] } },
        lines: ['天生丽质难自弃', '在天愿作比翼鸟', '天长地久有时尽'],
      },
    });
    setTimeout(function () {
      var scene = window.__fhl.app.scene;
      if (!scene || scene.id !== 'gloss') return;
      var q = new URLSearchParams(location.search);
      var sc = parseInt(q.get('sc') || '0', 10);
      if (sc > 0) {
        scene.touch('start', 187, 300);
        scene.touch('move', 187, 300 - sc);
        scene.touch('end', 187, 300 - sc);
      }
    }, 80);
  })();
</script>
</body>
</html>
