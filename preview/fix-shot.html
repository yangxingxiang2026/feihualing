<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>诗笺 · 勘误验收</title>
<style> html,body{margin:0;background:#1E1A16} canvas{display:block;width:375px;height:667px} </style></head>
<body>
<script src="./bundle.js"></script>
<script>
  (function () {
    if (!window.__fhl) return;
    window.__fhl.app.settings.reduceMotion = true;
    window.__fhl.goto('gloss', {
      outcome: {
        result: 'win', reason: 'roundsFull',
        stats: { hits: 5, tigerHits: 3, rounds: 12, keyword: '水', revenge: { kills: 0, newGrudge: [] } },
        lines: ['言入黄花川', '澄澄映葭苇', '声喧乱石中', '白水明田外', '碧峰出山后'],
      },
    });
    setTimeout(function () {
      var scene = window.__fhl.app.scene;
      if (!scene || scene.id !== 'gloss') return;
      var p = parseInt(new URLSearchParams(location.search).get('p') || '1', 10);
      for (var i = 1; i < p && scene.touch; i++) scene.touch('start', 172, 611), scene.touch('end', 172, 611);
    }, 80);
  })();
</script>
</body>
</html>
